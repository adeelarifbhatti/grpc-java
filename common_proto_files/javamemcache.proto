syntax = "proto3";
option java_package = "com.grpc.javamemcache.proto";
service MemCache {
   rpc add(EnterCountry) returns (Status);
   rpc query(Capital) returns (Country);
}
message EnterCountry {
   string country = 1;
   string capital = 2;
}
message Capital {
   string country = 1;
}
message Country {
   string capital = 1;
}
message Status {
   string responseMessage = 1;
   int32  responseCode  = 2;

}